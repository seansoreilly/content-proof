name: Archive transparency log head

# Fetches the signed Merkle tree head from the deployed service once a day and
# commits it to this repository. The git history then forms an independent,
# timestamped archive of the log's growth: any later head whose tree is not an
# extension of an earlier one proves the log was rewritten.
#
# Before committing, scripts/verify-log-head.mjs checks the new head's
# signature against the published keys and asks the service for an RFC 6962
# consistency proof from the previously archived head. If either fails the job
# fails and nothing is committed, so the red run itself is the alarm. The log
# says whether a check failed or the service could not be reached at all.
#
# Set the repository variable CONTENTPROOF_BASE_URL (e.g. https://contentproof.app)
# to enable it. Without it the job exits without doing anything.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The verifier is plain Node with no dependencies, so no npm ci.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch, verify and store the signed tree head
        env:
          BASE_URL: ${{ vars.CONTENTPROOF_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "CONTENTPROOF_BASE_URL is not set; nothing to archive."
            exit 0
          fi
          mkdir -p log-heads
          # The newest archived head, picked before the new one is written.
          previous=$(ls log-heads/*.json 2>/dev/null | sort | tail -n 1 || true)
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          new="log-heads/${stamp}.json"
          curl -fsS "${BASE_URL%/}/api/log/head" -o "$new"
          cat "$new"
          echo
          status=0
          node scripts/verify-log-head.mjs --base-url "$BASE_URL" "$new" ${previous:+"$previous"} || status=$?
          if [ "$status" -ne 0 ]; then
            # Nothing unverified is ever archived. Exit 3 means the service could
            # not be reached for the checks: an outage, not evidence of tampering.
            if [ "$status" -eq 3 ]; then
              echo "::error::Log head verification incomplete: the service was unavailable. Nothing archived."
            else
              echo "::error::Log head verification FAILED. Nothing archived."
            fi
            rm -f "$new"
            exit 1
          fi
      - name: Commit
        run: |
          set -euo pipefail
          if git status --porcelain log-heads | grep -q .; then
            git config user.name "contentproof-log-archiver"
            git config user.email "noreply@github.com"
            git add log-heads
            git commit -m "Archive transparency log head $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new head to commit."
          fi
